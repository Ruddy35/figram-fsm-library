# Полная проверка на многоядерной машине (N07): доказательства, сценарии,
# мутации, контракт хоста, Go с детектором гонок и честной параллельностью.
# verify.sh: код 0 — всё прошло; 1 — провал; 3 — с отступлениями (здесь тоже провал).
name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest          # 4 ядра
    timeout-minutes: 60
    defaults:
      run:
        shell: bash                 # bash --noprofile --norc -eo pipefail
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: Lean 4.35.0
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff   # v5
        with: { go-version: "1.23", cache: false }
      - run: python3 -c "import jsonschema" || pip install jsonschema
      - name: verify.sh
        # Полный вывод сохраняется артефактом: журнал однозначно связан с коммитом прогона.
        run: ./verify.sh 2>&1 | tee verify-full.log
      - name: Go — длительный параллельный прогон на всех ядрах
        run: |
          nproc
          .lake/build/bin/figram trace examples/pizza.bot.json 2000 40 11 > /tmp/long.jsonl
          cd ffi/go-example
          GOMAXPROCS=$(nproc) ./gofig-race -rounds 5 -bots 8 ../../examples/pizza.bot.json /tmp/long.jsonl
          GOMAXPROCS=$(nproc) ./gofig -rounds 50 -bots 8 ../../examples/pizza.bot.json /tmp/long.jsonl
      - name: Журналы проверки
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: verify-logs-${{ github.sha }}
          path: |
            verify-full.log
            verify-logs/
          if-no-files-found: warn
