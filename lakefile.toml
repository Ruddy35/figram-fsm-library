name = "figram"
version = "0.1.0"
defaultTargets = ["Figram", "figram", "figram-engine"]

[[lean_lib]]
name = "Figram"

[[lean_exe]]
name = "figram"
root = "Main"

[[lean_lib]]
name = "FigramApi"
roots = ["Figram.Api"]
defaultFacets = ["static"]

[[lean_exe]]
name = "figram-engine"
root = "EngineMain"

# Audit proposals (not a default target: product binaries are unchanged).
[[lean_lib]]
name = "FigramAudit"
srcDir = "audit/proofs"
roots = ["FigramAudit.Glue"]
